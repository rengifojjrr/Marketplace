# Publica la beta en GitHub Pages.
#
# `actions/configure-pages` con `enablement: true` activa Pages la primera vez,
# así que no hay que tocar nada en la configuración del repositorio.
# El sitio queda en https://<usuario>.github.io/<repo>/ y usa rutas relativas,
# de modo que funciona igual servido desde una subcarpeta.

name: Publicar beta en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Una publicación a la vez; no se cancela la que esté en curso.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Configurar Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Empaquetar el sitio
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Publicar
        id: despliegue
        uses: actions/deploy-pages@v4
