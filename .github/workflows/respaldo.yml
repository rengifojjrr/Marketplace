# =========================================================================
# Tumbo Market — respaldo diario de la base
# -------------------------------------------------------------------------
# Vuelca los esquemas tumbo y tumbo_privado (datos y privilegios), las
# funciones public.tm_* y los buckets de Tumbo (tools/respaldo.sh volcar),
# lo cifra con AES-256 (gpg, clave RESPALDO_CLAVE) y lo guarda como
# artefacto de este flujo durante 30 días. Nunca sube nada sin cifrar.
#
# Secretos del repositorio (Settings → Secrets and variables → Actions):
#   SUPABASE_DB_URL  la cadena de conexión de la base, con el usuario postgres
#                    (Supabase → Connect → Session pooler). Sin ella, el flujo
#                    termina avisando, sin fallar.
#   RESPALDO_CLAVE   la frase para cifrar (20 caracteres o más). Guárdala
#                    también fuera de GitHub: sin ella el respaldo no se abre.
# Restaurar y ensayar: docs/PRODUCCION.md («Respaldos»).
# =========================================================================
name: Respaldo

on:
  schedule:
    # 03:17 en Caracas (07:17 UTC), todos los días
    - cron: '17 7 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: respaldo
  cancel-in-progress: false

jobs:
  respaldo:
    name: Volcado cifrado de tumbo y tumbo_privado
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: ¿Está configurado?
        id: config
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          RESPALDO_CLAVE: ${{ secrets.RESPALDO_CLAVE }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "::warning title=Respaldo sin configurar::Falta el secreto SUPABASE_DB_URL: no se respaldó nada. Ver docs/PRODUCCION.md («Respaldos»)."
            echo "listo=no" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "${#RESPALDO_CLAVE}" -lt 20 ]; then
            echo "::error title=Respaldo sin cifrar::Falta el secreto RESPALDO_CLAVE (20 caracteres o más). Sin él no se guarda el respaldo: tendría las contraseñas cifradas y los datos de las personas."
            exit 1
          fi
          echo "listo=si" >> "$GITHUB_OUTPUT"
          echo "nombre=tumbo-respaldo-$(date -u +%Y%m%d-%H%M)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: steps.config.outputs.listo == 'si'

      - name: Cliente de PostgreSQL 17 (sirve para servidores 15, 16 y 17)
        if: steps.config.outputs.listo == 'si'
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt noble-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17
          /usr/lib/postgresql/17/bin/pg_dump --version

      - name: Volcado
        if: steps.config.outputs.listo == 'si'
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          PGBIN: /usr/lib/postgresql/17/bin
        run: |
          umask 077
          tools/respaldo.sh volcar "$SUPABASE_DB_URL" "$RUNNER_TEMP/respaldo.tar"

      - name: Cifrado (AES-256) y borrado del volcado sin cifrar
        if: steps.config.outputs.listo == 'si'
        env:
          RESPALDO_CLAVE: ${{ secrets.RESPALDO_CLAVE }}
          NOMBRE: ${{ steps.config.outputs.nombre }}
        run: |
          umask 077
          mkdir -p "$RUNNER_TEMP/salida"
          gpg --batch --yes --pinentry-mode loopback --passphrase-fd 3 --symmetric --cipher-algo AES256 \
            --output "$RUNNER_TEMP/salida/$NOMBRE.tar.gpg" "$RUNNER_TEMP/respaldo.tar" 3<<< "$RESPALDO_CLAVE"
          shred -u "$RUNNER_TEMP/respaldo.tar" || rm -f "$RUNNER_TEMP/respaldo.tar"
          ls -l "$RUNNER_TEMP/salida"

      - name: Guardar el respaldo cifrado
        if: steps.config.outputs.listo == 'si'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.config.outputs.nombre }}
          path: ${{ runner.temp }}/salida/*.tar.gpg
          retention-days: 30
          compression-level: 0
          if-no-files-found: error
