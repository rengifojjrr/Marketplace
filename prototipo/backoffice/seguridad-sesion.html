            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;

</head>
<body class="bg-background text-on-background font-body-md h-screen flex flex-col items-center justify-center p-md">
<!-- Mobile Container -->
<div class="w-full max-w-[400px] mx-auto bg-surface rounded-xl border border-outline-variant shadow-md p-lg flex flex-col items-center text-center">
<!-- Brand / Header -->
<div class="mb-xl w-full flex justify-center">
<div class="w-16 h-16 bg-primary-container rounded-full flex items-center justify-center shadow-sm">
<span class="material-symbols-outlined text-on-primary font-headline-lg text-headline-lg" data-icon="admin_panel_settings">admin_panel_settings</span>
</div>
</div>
<!-- Illustration / Icon -->
<div class="mb-md">
<span class="material-symbols-outlined text-error text-display-lg" data-icon="lock_person" style="font-size: 64px;">lock_person</span>
</div>
<!-- Copy -->
<h1 class="font-headline-md text-headline-md text-on-surface mb-sm">Sesión Expirada</h1>
<p class="font-body-md text-body-md text-on-surface-variant mb-xl">
            Por políticas de seguridad, necesitamos verificar tu identidad para continuar con esta acción de alto riesgo.
        </p>
<!-- Form -->
<form class="w-full flex flex-col gap-md">
<!-- Password Field -->
<div class="flex flex-col gap-xs text-left">
<label class="font-label-caps text-label-caps text-on-surface" for="password">Contraseña Administrativa</label>
<div class="relative w-full">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline" data-icon="key">key</span>
<input class="w-full h-11 pl-10 pr-4 bg-surface-container-lowest border border-outline-variant rounded focus:border-[#2563EB] focus:ring-1 focus:ring-[#2563EB] outline-none font-body-md text-on-surface transition-all" id="password" placeholder="••••••••" required="" type="password"/>
</div>
</div>
<!-- 2FA Field -->
<div class="flex flex-col gap-xs text-left">
<label class="font-label-caps text-label-caps text-on-surface" for="2fa">Código 2FA</label>
<div class="relative w-full">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline" data-icon="dialpad">dialpad</span>
<input class="w-full h-11 pl-10 pr-4 bg-surface-container-lowest border border-outline-variant rounded focus:border-[#2563EB] focus:ring-1 focus:ring-[#2563EB] outline-none font-data-mono text-data-mono text-on-surface transition-all tracking-widest text-center" id="2fa" maxlength="6" placeholder="000000" required="" type="text"/>
</div>
<p class="font-body-sm text-body-sm text-on-surface-variant mt-1 text-center">Ingresa el código de tu aplicación autenticadora.</p>
</div>
<!-- Action -->
<button class="mt-sm w-full h-11 bg-primary-container text-on-primary font-body-md text-body-md rounded-[10px] hover:bg-primary-container/90 active:scale-[0.98] transition-all flex items-center justify-center gap-2" type="submit">
<span class="material-symbols-outlined" data-icon="verified_user">verified_user</span>
                Re-autenticar
            </button>
</form>
<!-- Cancel -->
<button class="mt-md font-body-sm text-body-sm text-on-surface-variant underline hover:text-on-surface transition-colors" type="button">
            Cancelar y volver al Dashboard
         </button>
</div>

<!-- Runtime de la beta: estado simulado, RBAC, recorrido transversal. -->
